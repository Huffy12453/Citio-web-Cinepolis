<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Demo - Club Cinepolis</title>
    <link rel="stylesheet" href="style.css">
    <style>
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">CINEPOLIS</a>
        <nav>
            <a href="index.html">Volver a Inicio</a>
            <a href="login.html">Mi Cuenta</a>
        </nav>
    </header>

    <div class="login-container">
        <h2 style="margin-top: 0; color: #0b1528;">Ingresa a tu Club</h2>
        <form action="index.html">
            <label for="num_tarjeta">Numero de Tarjeta Club:</label>
            <input type="text" id="num_tarjeta" name="num_tarjeta" placeholder="Ej. 1234 5678 9101" required>

            <label for="nip_tarjeta">NIP:</label>
            <input type="password" id="nip_tarjeta" name="nip_tarjeta" placeholder="Tu NIP" required>

            <button type="submit" class="btn-submit">Entrar</button>
        </form>
        
        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ccc;">
        <h2 style="margin-top: 0; color: #0b1528;">Adquirir Tarjeta</h2>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">Unete y obten beneficios exclusivos.</p>
        
        <form action="index.html">
            <label for="nivel_tarjeta">Elige tu nivel:</label>
            <select id="nivel_tarjeta" name="nivel_tarjeta">
                <option value="fan">Nivel Fan - $59 MXN</option>
                <option value="fanatico">Nivel Fanatico - $99 MXN</option>
                <option value="superfan">Nivel Súper Fanatico - $149 MXN</option>
            </select>

            <label for="nombre_club">Nombre completo:</label>
            <input type="text" id="nombre_club" name="nombre_club" placeholder="Tu nombre" required>

            <label for="metodo_pago">Tarjeta de Credito/Debito:</label>
            <input type="text" id="metodo_pago" name="metodo_pago" placeholder="0000 0000 0000 0000" required>

            <button type="submit" class="btn-submit" style="background-color: #ffc107; color: #0b1528;">Comprar Suscripcion</button>
        </form>
    </div>

    <footer>
        <p> 2026 Cinepolis - Manuel Hector Muñiz Garcia - 5-I </p>
    </footer>

</body>
</html>
